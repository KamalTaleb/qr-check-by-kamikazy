<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR Check by Kamikazy</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="app">
    <header class="top">
      <img class="mark" src="icons/48.png" alt="" width="28" height="28">
      <h1>QR Check <span class="by">by Kamikazy</span></h1>
    </header>

    <div class="field">
      <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4.5 4.5 0 0 0 6.4 0l3-3a4.5 4.5 0 0 0-6.4-6.4l-1 1M14 10a4.5 4.5 0 0 0-6.4 0l-3 3a4.5 4.5 0 0 0 6.4 6.4l1-1"/></svg>
      <input id="link" type="text" placeholder="Paste a link" aria-label="Link" autocomplete="off" spellcheck="false">
      <button id="clear" class="icon-btn" type="button" aria-label="Clear link" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <button id="usePage" class="chip-btn" type="button" title="Use the page you are on">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h18v12H3zM3 7l3-3h6l2 3"/></svg>This page
      </button>
    </div>

    <section id="stage" class="stage" aria-live="polite">
      <div class="frame" id="frame">
        <canvas id="qr" aria-label="QR code preview"></canvas>
        <div class="empty" id="empty">
          <svg viewBox="0 0 120 120" aria-hidden="true">
            <rect class="ghost g1" x="12" y="12" width="30" height="30" rx="4"/>
            <rect class="ghost g2" x="78" y="12" width="30" height="30" rx="4"/>
            <rect class="ghost g3" x="12" y="78" width="30" height="30" rx="4"/>
            <rect class="ghost-dot g4" x="84" y="84" width="10" height="10" rx="2"/>
          </svg>
          <p>Paste a link to build a code</p>
        </div>
        <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
      </div>
      <p class="status" id="status"><span class="dot"></span><span id="statusText">Waiting for a link</span></p>
    </section>

    <section class="options" id="options">
      <button class="opt-toggle" id="optToggle" type="button" aria-expanded="false" aria-controls="optBody">
        <span>Style and export</span>
        <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="opt-body" id="optBody">
        <div class="opt-inner">
          <div class="opt-row">
            <span class="opt-label">Colours</span>
            <div class="presets" id="presets">
              <button type="button" data-fg="#000000" data-bg="#ffffff" aria-label="Black on white"></button>
              <button type="button" data-fg="#e5322d" data-bg="#ffffff" aria-label="Red on white"></button>
              <button type="button" data-fg="#1b2a4a" data-bg="#ffffff" aria-label="Navy on white"></button>
              <button type="button" data-fg="#ffffff" data-bg="#111111" aria-label="White on black"></button>
            </div>
          </div>
          <div class="swatches">
            <label class="swatch"><input id="fg" type="color" value="#000000"><span class="sw-dot"></span><span class="sw-text"><b>Code</b><em id="fgHex">#000000</em></span></label>
            <label class="swatch"><input id="bg" type="color" value="#ffffff"><span class="sw-dot"></span><span class="sw-text"><b>Back</b><em id="bgHex">#FFFFFF</em></span></label>
            <label class="switch"><input id="transparent" type="checkbox"><span class="track"><span class="knob"></span></span><span class="sw-text"><b>Clear</b><em id="clearState">Off</em></span></label>
          </div>

          <div class="opt-row"><span class="opt-label">Error fix</span><span class="opt-hint" id="eccHint">Recovers 15% damage</span></div>
          <div class="seg" role="radiogroup" aria-label="Error fix">
            <label><input type="radio" name="ecc" value="L"><span>Low</span></label>
            <label><input type="radio" name="ecc" value="M" checked><span>Medium</span></label>
            <label><input type="radio" name="ecc" value="Q"><span>High</span></label>
            <label><input type="radio" name="ecc" value="H"><span>Max</span></label>
            <i class="seg-pill"></i>
          </div>

          <div class="opt-row"><span class="opt-label">PNG size</span><span class="opt-hint">SVG is always sharp</span></div>
          <div class="seg" role="radiogroup" aria-label="PNG size">
            <label><input type="radio" name="pngSize" value="512"><span>512</span></label>
            <label><input type="radio" name="pngSize" value="1024" checked><span>1K</span></label>
            <label><input type="radio" name="pngSize" value="2048"><span>2K</span></label>
            <label><input type="radio" name="pngSize" value="4096"><span>4K</span></label>
            <i class="seg-pill"></i>
          </div>
        </div>
      </div>
    </section>

    <div class="actions">
      <button id="svg" class="btn primary" type="button" disabled>
        <span class="btn-face">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m0 0l-4.5-4.5M12 15l4.5-4.5M5 19h14"/></svg>
          <span class="btn-label">Download SVG</span>
        </span>
        <span class="btn-done"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="tick" d="M5 12.5l4.5 4.5L19 7.5"/></svg><span>Saved</span></span>
      </button>
      <button id="png" class="btn" type="button" disabled>
        <span class="btn-face"><span class="btn-label">PNG</span></span>
        <span class="btn-done"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="tick" d="M5 12.5l4.5 4.5L19 7.5"/></svg><span>Saved</span></span>
      </button>
      <button id="copy" class="btn" type="button" disabled>
        <span class="btn-face"><span class="btn-label">Copy</span></span>
        <span class="btn-done"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="tick" d="M5 12.5l4.5 4.5L19 7.5"/></svg><span>Copied</span></span>
      </button>
    </div>
  </main>

  <script src="qrcode.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
